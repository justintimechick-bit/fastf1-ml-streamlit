# Pit-wall telemetry defaults. Read from the project root.

[server]
headless = true
runOnSave = false
# Never rerun because a source file changed during a demo.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
font = "sans-serif"
baseRadius = "0.35rem"
buttonRadius = "0.3rem"
showSidebarBorder = true

[theme.light]
primaryColor = "#bd2035"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#101820"
borderColor = "#cbd3dc"
linkColor = "#006c91"
chartCategoricalColors = ["#007ba6", "#b84e00", "#157445"]

[theme.dark]
primaryColor = "#ff5263"
backgroundColor = "#080d12"
secondaryBackgroundColor = "#121b25"
textColor = "#f4f7fa"
borderColor = "#304152"
linkColor = "#65d9f5"
chartCategoricalColors = ["#65d9f5", "#ffac63", "#67e8a5"]
