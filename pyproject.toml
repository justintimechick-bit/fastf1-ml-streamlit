[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1ml"
version = "0.1.0"
description = "Cutoff-aware Formula 1 prediction and chronological evaluation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.8,<3.9",
  "pandas>=2.2,<3",
  "numpy>=1.26,<2.4",
  "pyarrow>=18,<24",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
app = ["streamlit>=1.50,<2"]
real = ["pypdf>=6,<7", "pdfplumber>=0.11.10,<0.12"]

[project.scripts]
f1ml = "f1ml.cli:main"
f1ml-app = "f1ml_app.launch:main"
f1ml-real = "f1ml_real.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1ml_app = ["views/*.py", "assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests/real"]
addopts = "-ra --confcutdir=tests/real"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
